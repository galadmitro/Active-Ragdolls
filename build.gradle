plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'dev.leo'
version = '1.21.1-0.7.5'

base {
    archivesName = 'Active-Ragdolls'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Configures NeoForge and Minecraft mapped dependencies for compileJava
neoForge {
    version = '21.1.65' // Adjust to match your target NeoForge version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        activeragdolls {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Links your local base mod JAR without bundling its package into the compiled output
    compileOnly files('libs/sable_player_ragdoll-1.21.1-0.7.5.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}