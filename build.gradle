plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78' // or your current moddev plugin version
}

group = 'dev.leo'
version = '1.21.1-0.7.5'

base {
    archivesName = 'Active-Ragdolls'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // Direct file reference to compile against the base mod JAR without bundling it into your output
    compileOnly files('libs/sable_player_ragdoll-1.21.1-0.7.5.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}